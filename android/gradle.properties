org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Config cache disabled until Hilt/KSP integration is verified.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
# KSP1 mode — Hilt 2.52's bytecode transformation requires KSP1 ordering.
# Bump to ksp.useKSP2=true once Hilt ships a KSP2-compatible release.
ksp.useKSP2=false
